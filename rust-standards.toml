# deadband's adoption map of the Rust standards (adoption.md of
# https://github.com/crumbkit/rust-standards). The standards have no released
# version yet, so the map names the draft and the commit it was reviewed
# against.

schema = "rust-standards/adoption/v1"
standards = { version = "draft", commit = "107f4eb72a8c26ed377329f70debdbc9f91540dc" }

# deadband is a command and a per-user daemon. It starts job processes and
# lowers the priority of normal-lane jobs. Its one durable state is the job
# history, an append-only file that the DUR-1 exception below covers. The
# durable-state profile also stands ready for any later store.
profiles = ["base", "cli", "child-process", "durable-state"]

[[decision]]
id = "lanes"
requirement = """
- Lane: `lane` in .github/workflows/ci.yml, on each pull request and each push to main. It runs every step of the pull-request lane in the standards' order (format, workflows, deny, shear, clippy, tests, doctests, rustdoc). It leaves out the `features` step, which the library profile needs and deadband does not adopt. Its budget is ten minutes, the job's timeout.
- Lane: `macos` in .github/workflows/ci.yml, on each pull request and each push to main, on a macOS runner. It runs clippy on all targets and the tests, so the macOS reader of the probe, which compiles only on macOS, is compiled, linted and tested. Its budget is ten minutes, the job's timeout.
- Lane: `advisories` in .github/workflows/ci.yml, daily at 06:43 UTC and on demand (BASE-29). Nothing waits for it.
- Lane: `release` in .github/workflows/release.yml, on each pushed `v*` tag, on demand, and on a pull request that changes the workflow. It runs the advisory check (BASE-29) and the tests on Linux and macOS, builds auditable binaries (BASE-30) for aarch64-apple-darwin, x86_64-unknown-linux-gnu and aarch64-unknown-linux-gnu, and attaches them to a GitHub release only when it runs for a tag. Its budget is thirty minutes per job, the jobs' timeout.
"""
purpose = "The pull-request lane stays within ten minutes on a small workspace and grows with the code. A daily advisory run catches an advisory published against a dependency already on main, and finding it after merge is safe because the advisory concerns code that is already on main."
realizations = [".github/workflows/ci.yml", ".github/workflows/release.yml"]

[[decision]]
id = "unsafe"
requirement = """
- Module: crates/deadband/src/probe/macos.rs, the macOS reader of the probe. It is the only module with unsafe code. The workspace lint `unsafe_code` is `deny`, and the module's declaration in crates/deadband/src/probe.rs carries `#[expect(unsafe_code, reason = ...)]`.
- Invariant: each unsafe call writes only into a buffer that the module owns and passes that buffer's exact length, or a pointer to one value of the type the call fills. `getloadavg` receives a one-element array and is asked for one value. `sysctlbyname` receives a NUL-terminated name, a buffer and its length, and a null new value of length 0, so it reads from the kernel and changes nothing. `proc_listchildpids` receives a buffer and its length in bytes. `proc_pid_rusage` receives a `rusage_info_v4` with the flavor that names that struct, and `mach_timebase_info` receives one `mach_timebase_info` struct. `getrusage` receives a pointer to one zeroed `rusage`, which it fills, and the module reads the value only after the call returns 0. Those four calls only read. `confstr` is called twice with `_CS_DARWIN_USER_TEMP_DIR`: first with a null buffer of length 0, which writes nothing and returns the length needed, then with a `Vec<u8>` of that length and that exact length, and it reads only. `getpeereid` receives a socket's descriptor and pointers to one `uid_t` and one `gid_t`, which it fills, and the module returns the `uid_t` only after the call returns 0. Compile-time assertions check that the buffer lengths match the C types `xsw_usage` and `int`.
"""
purpose = "macOS gives the memory pressure level and swap use only through sysctl, the load average through getloadavg, a process tree's CPU and disk use through libproc, and the usage of a job's waited-for children through getrusage, the per-user temporary directory through confstr, and the uid of a socket's peer through getpeereid, all C calls. A measured comparison chose to call them through libc, because the sysinfo crate has no memory pressure level. Keeping every unsafe call in one small module with one stated invariant lets a reviewer check all of it in one place."
realizations = ["crates/deadband/src/probe/macos.rs", "crates/deadband/src/probe.rs", "Cargo.toml"]

[[exception]]
rule = "DUR-1"
paths = ["crates/deadband/src/history/writer.rs"]
owner = "the owner"
reason = "The job history is an append-only JSON Lines file, and a temporary file with a rename cannot append. Each line is one write, the next open repairs a torn last line, a reader skips a line it cannot parse, and each line carries a format version (DUR-3)."
correction = "a later store for fast lookups replaces the append log, if the replay of the history shows one is needed"

[[exception]]
rule = "CLI-7"
paths = ["crates/deadband/src/main.rs"]
owner = "Luke"
reason = "deadband keeps no crumbkit-usage log and has no `self usage` command yet. The first pull request with a command adds only `deadband status`."
correction = "a later deadband pull request turns it on"

[[exception]]
rule = "CLI-6"
paths = ["crates/deadband/tests/conventions.rs"]
items = ["crumbkit-test:check_path_weights"]
owner = "Luke"
reason = "The convention suite skips crumbkit-test's `check_path_weights`; the skip and its reason are in tests/conventions.rs."
correction = "a later deadband pull request turns it on"

[[exception]]
rule = "CLI-6"
paths = ["crates/deadband/tests/conventions.rs"]
items = ["crumbkit-test:check_command_reference"]
owner = "Luke"
reason = "The convention suite skips crumbkit-test's `check_command_reference`; the skip and its reason are in tests/conventions.rs."
correction = "a later deadband pull request turns it on"

[[exception]]
rule = "CLI-6"
paths = ["crates/deadband/tests/conventions.rs"]
items = ["crumbkit-test:check_examples"]
owner = "Luke"
reason = "The convention suite skips crumbkit-test's `check_examples`; the `run` example would start a build and the `daemon` example does not exit."
correction = "a later deadband pull request turns it on"

[[exception]]
rule = "CLI-6"
paths = ["crates/deadband/tests/conventions.rs"]
items = ["crumbkit-test:check_twins"]
owner = "Luke"
reason = "The convention suite skips crumbkit-test's `check_twins`; the skip and its reason are in tests/conventions.rs."
correction = "a later deadband pull request turns it on"

[[exception]]
rule = "PROC-1"
paths = ["crates/deadband/src/job.rs", "crates/deadband/src/job/forward.rs", "crates/deadband/src/job/reclaimer.rs", "crates/deadband/src/job/busiest.rs", "crates/deadband/src/job/on_stuck.rs"]
owner = "Luke"
reason = "`deadband run` exists to run the command its caller names, so job.rs's one operation takes an arbitrary program and arguments. The caller could run the same command without deadband, so deadband adds no privilege. job.rs states PROC-2's five items for the operation. job/reclaimer.rs runs the reclaimer command and job/on_stuck.rs the `on_stuck` command that the daemon's config file names, which the person who runs the daemon writes and could run as themselves. job/busiest.rs runs the fixed command `/bin/ps`, whose words the daemon passes. Each of the three states PROC-2's five items for its operation."
correction = "a change to the child-process profile that covers a wrapper which runs its caller's command, or a decision that records this one"

[[exception]]
rule = "CLI-2"
paths = ["crates/deadband/src/cli.rs", "crates/deadband/src/cli/commands.rs", "crates/deadband/src/job.rs", "crates/deadband/src/job/forward.rs"]
owner = "Luke"
reason = "`deadband run` and `deadband daemon` print no crumbkit Document; both declare `prints_no_result`. `run` starts its job with std's Command in place of `crumbkit_child::hand_over`. crumbkit-child is a crate new to deadband's graph, which needs an eval first. Without it, a Ctrl-C at the terminal reaches both deadband and the job, and deadband passes the SIGINT on as well, so the job receives it twice."
correction = "a later deadband pull request evaluates crumbkit-child and hands the terminal to the job through it"

[[exception]]
rule = "CLI-2"
paths = ["crates/deadband/src/cli.rs", "crates/deadband/src/cli/commands.rs", "crates/deadband/src/tui.rs"]
owner = "Luke"
reason = "`deadband top` draws a full-screen view on the terminal and prints no crumbkit Document; it declares `prints_no_result`. A pipe or `--json` is refused with `deadband::top::not_a_terminal`, whose recovery names `deadband status`, which prints the one-moment Document."
correction = "a change to the cli profile that covers a full-screen terminal view, or a decision that records this one"
