# The union of the clippy.toml fragments of the base, cli, child-process and
# durable-state profiles of the Rust standards. Each effect belongs to one
# owning module, which suppresses the lint with #[expect] and a reason
# (BASE-5). The environment, process, priority and entry-point effects have
# owning modules now, and their reasons name them. The DUR-1 and DUR-2
# entries have no atomic writer and no lock module yet. Their uses are in
# crates/deadband/src/daemon/bind.rs, whose take_lock creates an empty lock
# file and locks it without waiting for both the daemon's socket and the
# job history's writer, and in
# crates/deadband/src/history/writer.rs, which appends to the job history
# under the DUR-1 exception in rust-standards.toml. Each #[expect] reason says
# so. The change that adds a writer or lock module names its path in the
# reason.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
too-many-lines-threshold = 150 # BASE-10
max-fn-params-bools = 3 # BASE-16

disallowed-methods = [
    # BASE-6
    { path = "std::env::var", reason = "read the environment snapshot" },
    { path = "std::env::var_os", reason = "read the environment snapshot" },
    { path = "std::env::vars", reason = "only the entry point captures the environment" },
    { path = "std::env::vars_os", reason = "only the entry point captures the environment" },
    { path = "std::env::set_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::remove_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::current_dir", reason = "read the directory from the snapshot" },
    { path = "std::env::set_current_dir", reason = "pass the directory to the operation instead" },
    # BASE-7
    { path = "std::process::exit", reason = "return the exit code from main so destructors run" },
    # BASE-11
    { path = "std::thread::sleep", reason = "wait for an observable signal, or sleep in the clock owner" },
    { path = "tokio::time::sleep", reason = "wait for an observable signal, or sleep in the clock owner", allow-invalid = true },
    # CLI-1
    { path = "std::io::stdout", reason = "write through the output module" },
    { path = "std::io::stderr", reason = "write through the output module" },
    { path = "std::io::stdin", reason = "read through the output module, which knows whether input is a terminal" },
    # PROC-1
    { path = "std::process::Command::new", reason = "start processes through the process module" },
    { path = "std::process::Command::spawn", reason = "start processes through the process module" },
    { path = "std::process::Command::status", reason = "start processes through the process module" },
    { path = "std::process::Command::output", reason = "start processes through the process module" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "replacing this process bypasses the process module" },
    { path = "tokio::process::Command::new", reason = "start processes through the process module", allow-invalid = true },
    { path = "tokio::process::Command::spawn", reason = "start processes through the process module", allow-invalid = true },
    { path = "tokio::process::Command::status", reason = "start processes through the process module", allow-invalid = true },
    { path = "tokio::process::Command::output", reason = "start processes through the process module", allow-invalid = true },
    # The throttle module is the only one that changes a job's priority.
    { path = "rustix::process::setpriority_process", reason = "change a job's priority through the throttle module" },
    { path = "rustix::process::nice", reason = "change a job's priority through the throttle module" },
    # Only the throttle module sends a signal of deadband's own choosing. The
    # job forwarding module (crates/deadband/src/job/forward.rs) passes on a
    # SIGTERM or SIGINT that `deadband run` received, unchanged (decided by the
    # owner on 2026-11-13).
    { path = "rustix::process::kill_process", reason = "send signals through the throttle module, or pass a received signal on through the job forwarding module" },
    { path = "rustix::process::kill_process_group", reason = "send signals through the throttle module, or pass a received signal on through the job forwarding module" },
    # DUR-1
    { path = "std::fs::write", reason = "write through the atomic writer" },
    { path = "std::fs::copy", reason = "write through the atomic writer" },
    { path = "std::fs::rename", reason = "write through the atomic writer" },
    { path = "std::fs::File::create", reason = "write through the atomic writer" },
    { path = "std::fs::OpenOptions::new", reason = "write through the atomic writer" },
    # DUR-2
    { path = "std::fs::File::lock", reason = "lock through the lock module, which owns the deadline" },
    { path = "std::fs::File::try_lock", reason = "lock through the lock module, which owns the deadline" },
    { path = "std::fs::File::lock_shared", reason = "lock through the lock module, which owns the deadline" },
    { path = "std::fs::File::try_lock_shared", reason = "lock through the lock module, which owns the deadline" },
]

disallowed-types = [
    # PROC-1
    { path = "std::process::Child", reason = "let the process module hold the child, which owns its deadline and cleanup" },
]

# BASE-7: deadband has no error crate yet. The change that adds one lists its
# untyped-error macros here.
disallowed-macros = []
