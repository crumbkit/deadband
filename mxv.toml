# The daemon is the one process that deadband has. `mxv up` builds the binary
# through deadband, then starts `deadband daemon` on a socket of its own inside
# the checkout, so a workspace's daemon never answers for the person's own
# daemon. A daemon on its own socket records no job history and runs no
# reclaimer, as the log line it writes says. The daemon listens on a Unix
# socket, so the file declares no port and no route.
#
# The socket path is relative, and mxv starts the process at the top of its
# checkout, so the socket is `target/deadband.sock` in the checkout. A caller
# reaches that daemon only with the same value of DEADBAND_SOCKET from the
# checkout's top, or with the absolute path, as in
# `DEADBAND_SOCKET="$PWD/target/deadband.sock" deadband status`.
#
# The tasks run the commands of the pull-request lane in AGENTS.md that
# need no environment variable and no tool beyond cargo. The lane's other
# commands set CARGO_BUILD_WARNINGS or `RUSTDOCFLAGS` or run other tools, which
# a task cannot do.

[processes.deadband]
argv = ["target/debug/deadband", "daemon"]
build = ["cargo", "build", "--locked", "--bin", "deadband"]
env = { DEADBAND_SOCKET = "target/deadband.sock" }
ready = { log = "the daemon listens on", timeout_seconds = 30 }

# jumpgate reads this table and mxv ignores it. It names the daemon's socket
# so that another app's need can be bound to it. The unit is the process above
# and the path is the DEADBAND_SOCKET that process sets.

[provides.deadband-socket]
kind = "socket"
unit = "deadband"
path = "target/deadband.sock"

[tasks.fmt]
argv = ["cargo", "fmt", "--check"]

[tasks.clippy]
argv = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features"]

[tasks.test]
argv = ["cargo", "nextest", "run", "--locked", "--workspace", "--all-features"]

[tasks.doctest]
argv = ["cargo", "test", "--locked", "--doc", "--workspace", "--all-features"]
