[package]
name = "deadband"
description = "Keeps a busy machine usable while many heavy jobs compete for it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "deadband"
path = "src/main.rs"
# The binary has no API to document, and its docs would take the crate name
# that rustdoc gives the library docs.
doc = false

[features]
default = ["tui"]
# `deadband top`. A program that embeds the deadband library sets
# `default-features = false`, so it does not inherit ratatui.
tui = ["dep:ratatui"]

[dependencies]
# clap parses the command line. These are the user-facing features that a
# binary chooses: help, usage lines and the context of a refusal.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# crumbkit holds the command-line conventions: parsing, `--json` documents
# and failures with stable codes (the cli profile of the Rust standards).
crumbkit = "0.2"
# serde and schemars derive the JSON form and the JSON Schema of the sample
# that `deadband status --json` prints. crumbkit already depends on both.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }
# serde_json writes and reads the one-line JSON messages that `run`,
# `status` and the daemon exchange over the socket. crumbkit already
# depends on it.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# rustix sets the umask while the daemon makes its socket, raises the limit
# on open files, and names the errors of a failed accept, all without
# unsafe code. crumbkit already depends on it on Unix.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }

# basic-toml reads the daemon's config file. A measured comparison chose it
# over the toml crate: it adds one crate, which depends only on serde, and
# its refusals read as one line.
basic-toml = "0.1.10"
# humantime reads the ages in the config file, such as "60s", and writes
# the time of the last reclaim. crumbkit already depends on it.
humantime = { version = "2.4.0", default-features = false }

# regex-lite matches a job's command line against the `stuck_ignore` list of
# the daemon's config file. The eval /evals/deadband-commands-regex chose it
# for the same kind of list: it adds one crate and about 142 KB of binary, and
# its refusals read as one line.
regex-lite = "0.1.9"

# ratatui draws `deadband top`, and its crossterm feature owns the terminal.
# The eval /evals/deadband-top-terminal-library chose it over ratatui-core
# with crossterm and over hand-written ANSI: it adds 0.27 MiB of stripped
# binary, and the crates the view needs are maintained in one place. Only the
# `tui` feature brings it in.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }

# libc calls getloadavg and sysctlbyname, which read the load average, the
# memory pressure level and swap use on macOS, and getrusage, which reads the
# CPU time and peak memory of a job's waited-for children. A measured comparison chose
# libc over the sysinfo crate, which has no memory pressure level.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# crumbkit-test checks the command's tool record, effects, documents,
# schemas, exit codes, failure codes and recoveries against crumbkit's
# conventions.
crumbkit-test = "0.2"

[lints]
workspace = true
