[package]
name = "deadband"
description = "Keeps a busy machine usable while many heavy jobs compete for it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "deadband"
path = "src/main.rs"
# The binary has no API to document, and its docs would take the crate name
# that rustdoc gives the library docs.
doc = false

[dependencies]
# clap parses the command line. These are the user-facing features that a
# binary chooses: help, usage lines and the context of a refusal.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# crumbkit holds the command-line conventions: parsing, `--json` documents
# and failures with stable codes (the cli profile of the Rust standards).
crumbkit = "0.1.0"
# serde and schemars derive the JSON form and the JSON Schema of the sample
# that `deadband status --json` prints. crumbkit already depends on both.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }

# libc calls getloadavg and sysctlbyname, which read the load average, the
# memory pressure level and swap use on macOS. A measured comparison chose
# libc over the sysinfo crate, which has no memory pressure level.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# crumbkit-test checks the command's guide, effects, documents, schemas,
# exit codes, failure codes and recoveries against crumbkit's conventions.
crumbkit-test = "0.1.0"

[lints]
workspace = true
